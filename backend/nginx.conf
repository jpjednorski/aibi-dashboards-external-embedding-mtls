events {}

http {
  upstream flask_backend {
    server backend:5000;
  }

  upstream vite_dev {
    server host.docker.internal:3000;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # API routes - require mTLS
    location /api/ {
      # Enforce mTLS for API endpoints
      if ($ssl_client_verify != SUCCESS) {
        return 400 "No required SSL certificate was sent";
      }

      proxy_pass http://flask_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      # mTLS identity headers for the Flask app
      proxy_set_header X-Client-Verify $ssl_client_verify;
      proxy_set_header X-Client-Subject-Dn $ssl_client_s_dn;
      proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;
    }

    # Frontend dev server - no mTLS required for static assets
    location / {
      proxy_pass http://vite_dev;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      
      # WebSocket support for Vite HMR
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
